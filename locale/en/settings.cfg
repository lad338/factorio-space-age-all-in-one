[mod-setting-description]
simulacruis-zone-1-radius=Radius (in tiles) of the pure-Nauvis starting zone at the center of Simulacruis. Default: 300. Set to 0 to skip this zone entirely.
simulacruis-zone-2-radius=Outer radius (in tiles) of the early inner-planet zone (Nauvis/Vulcanus/Fulgora/Gleba mix). Default: 1000. Set to 0, or equal to or below Zone 1's radius, to skip this zone.
simulacruis-zone-3-radius=Outer radius (in tiles) of the mid-game zone (adds Aquilo). Zone 4 begins beyond this radius and has no outer bound. Default: 3000. Set to 0, or equal to or below Zone 2's radius, to skip this zone — setting Zones 1-3 all to 0 makes the whole map Zone 4.
simulacruis-starter-oil-patch=Guarantees a small low-yield crude oil patch near spawn, so a bad map roll can never leave a player with no practically reachable oil. Independent of the normal Crude Oil map-gen slider. Off by default.
simulacruis-scrap-from-start=Recycling requires no prerequisites other than mining Fulgoran Ruin Vault. Easier access to advanced materials for even easier early game. Off by default.