[mod-setting-description]
simulacruis-zone-1-radius=Base radius (in tiles) of the pure-Nauvis starting zone, used as the "Normal" (1x) reference point for the in-game Zone 1 Radius Coverage slider (Map Generator > Terrain). Default: 300. Set to 0 to remove this zone entirely, regardless of that slider.
simulacruis-zone-2-radius=Base outer radius (in tiles) of the early inner-planet zone (Nauvis/Vulcanus/Fulgora/Gleba mix), used as the "Normal" (1x) reference point for the in-game Zone 2 Radius Coverage slider. Default: 1000. Set to 0, or at or below Zone 1's own base radius, to remove this zone entirely, regardless of that slider.
simulacruis-zone-3-radius=Base outer radius (in tiles) of the mid-game zone (adds Aquilo), used as the "Normal" (1x) reference point for the in-game Zone 3 Radius Coverage slider. Zone 4 begins beyond this radius and has no outer bound. Default: 3000. Set to 0, or at or below Zone 2's own base radius, to remove this zone entirely, regardless of that slider — setting Zones 1-3 all to 0 makes the whole map Zone 4.
simulacruis-starter-oil-patch=Guarantees a small low-yield crude oil patch near spawn, so a bad map roll can never leave a player with no practically reachable oil. Independent of the normal Crude Oil map-gen slider. Off by default.
simulacruis-scrap-from-start=Recycling requires no prerequisites other than mining Fulgoran Ruin Vault. Easier access to advanced materials for even easier early game. Off by default.